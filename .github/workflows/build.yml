name: Build Production Frappe Image

on:
  push:
    branches: [main]
    paths:
      - 'apps.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: "Frappe Branch"
        required: true
        default: "version-16"
      image_tag:
        description: "Image Tag"
        required: true
        default: "version-16"  

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: petekersker/my-frappe
  FRAPPE_PATH: https://github.com/frappe/frappe
  FRAPPE_BRANCH: ${{ github.event.inputs.frappe_branch || 'version-16' }}
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Validate and encode apps.json
        id: apps
        run: |
          jq empty apps.json
          APPS_B64=$(base64 -w 0 apps.json)
          echo "apps_json_base64=$APPS_B64" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frappe image
        uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/layered/Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag || 'version-16' }}-${{ github.run_number }}
          build-args: |
            FRAPPE_PATH=${{ env.FRAPPE_PATH }}
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ steps.apps.outputs.apps_json_base64 }}
